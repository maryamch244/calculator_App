<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="google-site-verification" content="QARjR8uXBDXLPl0IMcInlx18LQzkLa1KcrVgCGGftHI" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
        }
        
        .calculator {
            width: min(92vw, 360px);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }
        
        .title {
            margin: 0 0 14px;
            font-size: 1rem;
            opacity: 0.85;
            text-align: center;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        
        .display {
            width: 100%;
            height: 80px;
            border: none;
            outline: none;
            border-radius: 18px;
            margin-bottom: 16px;
            padding: 16px;
            text-align: right;
            font-size: 2rem;
            background: #e2e8f0;
            color: #0f172a;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.12);
        }
        
        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        
        button {
            border: none;
            border-radius: 16px;
            height: 64px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s ease, filter 0.12s ease;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        }
        
        button:hover {
            filter: brightness(1.08);
        }
        
        button:active,
        button.active {
            transform: scale(0.96);
        }
        
        .number {
            background: #334155;
            color: #fff;
        }
        
        .operator {
            background: #f59e0b;
            color: #111827;
        }
        
        .equal {
            background: #22c55e;
            color: #052e16;
        }
        
        .clear {
            background: #ef4444;
            color: white;
        }
        
        .wide {
            grid-column: span 2;
        }
        
        .hint {
            margin-top: 14px;
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>

<body>
    <div class="calculator">
        <h1 class="title">Basic Calculator</h1>
        <input id="display" class="display" type="text" value="0" readonly />

        <div class="keys">
            <button class="clear wide" data-action="clear">C</button>
            <button class="operator" data-value="/">÷</button>
            <button class="operator" data-value="*">×</button>

            <button class="number" data-value="7">7</button>
            <button class="number" data-value="8">8</button>
            <button class="number" data-value="9">9</button>
            <button class="operator" data-value="-">−</button>

            <button class="number" data-value="4">4</button>
            <button class="number" data-value="5">5</button>
            <button class="number" data-value="6">6</button>
            <button class="operator" data-value="+">+</button>

            <button class="number" data-value="1">1</button>
            <button class="number" data-value="2">2</button>
            <button class="number" data-value="3">3</button>
            <button class="equal" data-action="calculate">=</button>

            <button class="number wide" data-value="0">0</button>
            <button class="number" data-value=".">.</button>
            <button class="operator" data-action="backspace">⌫</button>
        </div>

        <div class="hint">Keyboard supported: 0-9, +, -, *, /, Enter, Backspace, Esc</div>
    </div>

    <script>
        const display = document.getElementById('display');
        const buttons = document.querySelectorAll('button');

        let expression = '';
        let justCalculated = false;

        function updateDisplay(value) {
            display.value = value || '0';
        }

        function sanitizeExpression(expr) {
            return expr.replace(/×/g, '*').replace(/÷/g, '/');
        }

        function appendValue(value) {
            if (justCalculated && /[0-9.]/.test(value)) {
                expression = '';
            }

            if (justCalculated && /[+\-*/]/.test(value)) {
                justCalculated = false;
            }

            if (value === '.') {
                const parts = expression.split(/[+\-*/]/);
                const currentPart = parts[parts.length - 1];
                if (currentPart.includes('.')) return;
                if (currentPart === '') {
                    expression += '0';
                }
            }

            if (/[+\-*/]/.test(value)) {
                if (expression === '' && value !== '-') return;
                if (/[+\-*/]$/.test(expression)) {
                    expression = expression.slice(0, -1) + value;
                    updateDisplay(expression);
                    justCalculated = false;
                    return;
                }
                justCalculated = false;
            }

            expression += value;
            updateDisplay(expression);
            justCalculated = false;
        }

        function clearDisplay() {
            expression = '';
            justCalculated = false;
            updateDisplay('0');
        }

        function backspace() {
            if (justCalculated) {
                clearDisplay();
                return;
            }
            expression = expression.slice(0, -1);
            updateDisplay(expression || '0');
        }

        function calculate() {
            if (!expression || /[+\-*/.]$/.test(expression)) return;
            try {
                const result = Function(`return ${sanitizeExpression(expression)}`)();
                if (!Number.isFinite(result)) {
                    updateDisplay('Error');
                    expression = '';
                    justCalculated = false;
                    return;
                }
                expression = String(result);
                updateDisplay(expression);
                justCalculated = true;
            } catch {
                updateDisplay('Error');
                expression = '';
                justCalculated = false;
            }
        }

        document.querySelector('.keys').addEventListener('click', (event) => {
            const button = event.target.closest('button');
            if (!button) return;

            const {
                value,
                action
            } = button.dataset;
            if (value !== undefined) appendValue(value);
            if (action === 'clear') clearDisplay();
            if (action === 'calculate') calculate();
            if (action === 'backspace') backspace();
        });

        document.addEventListener('keydown', (event) => {
            const key = event.key;
            const selector = `[data-value="${key.replace(/"/g, '\\"')}"]`;
            const button = document.querySelector(selector);

            if ((/^[0-9]$/).test(key) || ['+', '-', '*', '/', '.'].includes(key)) {
                appendValue(key);
                if (button) pulse(button);
            } else if (key === 'Enter' || key === '=') {
                calculate();
                pulse(document.querySelector('[data-action="calculate"]'));
            } else if (key === 'Backspace') {
                backspace();
                pulse(document.querySelector('[data-action="backspace"]'));
            } else if (key === 'Escape' || key.toLowerCase() === 'c') {
                clearDisplay();
                pulse(document.querySelector('[data-action="clear"]'));
            }
        });

        function pulse(button) {
            if (!button) return;
            button.classList.add('active');
            setTimeout(() => button.classList.remove('active'), 120);
        }

        updateDisplay('0');
    </script>
</body>

</html>
