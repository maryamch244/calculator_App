<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
         :root {
            --bg-main: #1a1a2e;
            --calc-body: #16213e;
            --display-bg: #0f0f23;
            --display-text: #eaeaea;
            --operator: #e94560;
            --number: #2a2a4a;
            --equals: #4ecca3;
            --clear: #ff6b6b;
            --text-light: #a0a0a0;
            --hover-glow: rgba(233, 69, 96, 0.3);
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-main);
            background-image: radial-gradient(ellipse at 20% 80%, rgba(233, 69, 96, 0.15) 0%, transparent 50%), radial-gradient(ellipse at 80% 20%, rgba(78, 204, 163, 0.1) 0%, transparent 50%), radial-gradient(ellipse at 50% 50%, rgba(22, 33, 62, 0.8) 0%, transparent 100%);
            font-family: 'Outfit', sans-serif;
            padding: 20px;
        }
        
        .calculator {
            background: var(--calc-body);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 380px;
            transform: perspective(1000px) rotateX(2deg);
            transition: transform 0.3s ease;
        }
        
        .calculator:hover {
            transform: perspective(1000px) rotateX(0deg) translateY(-5px);
        }
        
        .display {
            background: var(--display-bg);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 24px;
            text-align: right;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .display::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }
        
        .previous-operand {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 300;
            color: var(--text-light);
            min-height: 24px;
            letter-spacing: 1px;
        }
        
        .current-operand {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(32px, 8vw, 48px);
            font-weight: 300;
            color: var(--display-text);
            word-break: break-all;
            word-wrap: break-word;
            line-height: 1.2;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        
        .btn {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 500;
            border: none;
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
            background: var(--number);
            color: var(--display-text);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.2);
        }
        
        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 20px var(--hover-glow);
        }
        
        .btn:hover::before {
            opacity: 1;
        }
        
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3), 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        .btn.operator {
            background: var(--operator);
            color: white;
            font-weight: 600;
        }
        
        .btn.operator:hover {
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 25px rgba(233, 69, 96, 0.5);
        }
        
        .btn.equals {
            background: var(--equals);
            color: #1a1a2e;
            font-weight: 600;
        }
        
        .btn.equals:hover {
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 25px rgba(78, 204, 163, 0.5);
        }
        
        .btn.clear,
        .btn.delete {
            background: var(--clear);
            color: white;
            font-weight: 600;
            font-size: 16px;
        }
        
        .btn.clear:hover,
        .btn.delete:hover {
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 25px rgba(255, 107, 107, 0.5);
        }
        
        .btn.span-2 {
            grid-column: span 2;
        }
        
        .btn .icon {
            font-size: 18px;
        }
        /* Keyboard hint */
        
        .keyboard-hint {
            text-align: center;
            margin-top: 20px;
            color: var(--text-light);
            font-size: 12px;
            opacity: 0.6;
        }
        
        .keyboard-hint kbd {
            background: var(--number);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            margin: 0 2px;
        }
        /* Responsive */
        
        @media (max-width: 420px) {
            .calculator {
                padding: 20px;
                border-radius: 20px;
            }
            .btn {
                padding: 14px;
                font-size: 18px;
            }
            .display {
                padding: 18px 14px;
                min-height: 90px;
            }
            .current-operand {
                font-size: 36px;
            }
        }
        /* Animation for result */
        
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }
        
        .result-pulse {
            animation: pulse 0.3s ease;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>

        <div class="buttons">
            <button class="btn clear" data-action="clear">AC</button>
            <button class="btn delete" data-action="delete">DEL</button>
            <button class="btn" data-action="percent">%</button>
            <button class="btn operator" data-operator="÷">÷</button>

            <button class="btn" data-number="7">7</button>
            <button class="btn" data-number="8">8</button>
            <button class="btn" data-number="9">9</button>
            <button class="btn operator" data-operator="×">×</button>

            <button class="btn" data-number="4">4</button>
            <button class="btn" data-number="5">5</button>
            <button class="btn" data-number="6">6</button>
            <button class="btn operator" data-operator="−">−</button>

            <button class="btn" data-number="1">1</button>
            <button class="btn" data-number="2">2</button>
            <button class="btn" data-number="3">3</button>
            <button class="btn operator" data-operator="+">+</button>

            <button class="btn span-2" data-number="0">0</button>
            <button class="btn" data-action="decimal">.</button>
            <button class="btn equals" data-action="equals">=</button>
        </div>

        <div class="keyboard-hint">
            Keyboard: <kbd>0-9</kbd> <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd> <kbd>Enter</kbd> <kbd>Esc</kbd> <kbd>⌫</kbd>
        </div>
    </div>

    <script>
        // Simple Calculator - Easy to Understand!

        let current = '0'; // What user is typing
        let previous = ''; // First number in calculation
        let op = ''; // Current operation

        const display = document.getElementById('current-operand');
        const prevDisplay = document.getElementById('previous-operand');

        // Update the screen
        function updateDisplay() {
            display.textContent = current;
            if (previous && op) {
                prevDisplay.textContent = previous + ' ' + op;
            } else {
                prevDisplay.textContent = '';
            }
        }

        // Add a number when clicked
        function addNumber(num) {
            if (current === '0' || current === 'Error') {
                current = num;
            } else if (current.length < 12) {
                current += num;
            }
            updateDisplay();
        }

        // Add decimal point
        function addDecimal() {
            if (!current.includes('.')) {
                current += '.';
            }
            updateDisplay();
        }

        // Choose an operation (+, -, ×, ÷)
        function chooseOperation(operator) {
            if (previous && op && current !== '0') {
                calculate(); // Chain calculations
            }
            previous = current;
            op = operator;
            current = '0';
            updateDisplay();
        }

        // Calculate the result
        function calculate() {
            if (!previous || !op) return;

            let a = parseFloat(previous);
            let b = parseFloat(current);
            let result;

            switch (op) {
                case '+':
                    result = a + b;
                    break;
                case '−':
                    result = a - b;
                    break;
                case '×':
                    result = a * b;
                    break;
                case '÷':
                    if (b === 0) {
                        current = 'Error';
                        previous = '';
                        op = '';
                        updateDisplay();
                        return;
                    }
                    result = a / b;
                    break;
                default:
                    return;
            }

            // Round to avoid floating point errors
            result = Math.round(result * 100000000) / 100000000;
            current = result.toString();
            previous = '';
            op = '';
            updateDisplay();
        }

        // Clear everything (AC)
        function clearAll() {
            current = '0';
            previous = '';
            op = '';
            updateDisplay();
        }

        // Delete last character (DEL)
        function deleteLast() {
            if (current.length === 1 || current === 'Error') {
                current = '0';
            } else {
                current = current.slice(0, -1);
            }
            updateDisplay();
        }

        // Handle button clicks
        function handleClick(value, type) {
            if (type === 'number') {
                addNumber(value);
            } else if (type === 'operator') {
                chooseOperation(value);
            } else if (type === 'action') {
                if (value === 'clear') clearAll();
                else if (value === 'delete') deleteLast();
                else if (value === 'decimal') addDecimal();
                else if (value === 'equals') calculate();
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            const key = e.key;

            if (key >= '0' && key <= '9') {
                addNumber(key);
            } else if (key === '.') {
                addDecimal();
            } else if (key === '+' || key === '-') {
                chooseOperation(key);
            } else if (key === '*') {
                chooseOperation('×');
            } else if (key === '/') {
                chooseOperation('÷');
            } else if (key === 'Enter' || key === '=') {
                calculate();
            } else if (key === 'Escape') {
                clearAll();
            } else if (key === 'Backspace') {
                deleteLast();
            }
        });

        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.dataset.number !== undefined) {
                    addNumber(btn.dataset.number);
                } else if (btn.dataset.operator !== undefined) {
                    chooseOperation(btn.dataset.operator);
                } else if (btn.dataset.action === 'clear') {
                    clearAll();
                } else if (btn.dataset.action === 'delete') {
                    deleteLast();
                } else if (btn.dataset.action === 'decimal') {
                    addDecimal();
                } else if (btn.dataset.action === 'equals') {
                    calculate();
                }
            });
        });
    </script>
</body>

</html>
